name: Paper-Trading-Bot

on:
  schedule:
    - cron: "7 * * * *"   # jede Stunde zur Minute 7 (UTC)
  workflow_dispatch:
    inputs:
      test:
        description: "Test-Nachricht an Telegram senden"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Bot ausführen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_NACHRICHT: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
        run: python bot.py

      - name: Ergebnisse speichern
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add daten || true
          git diff --cached --quiet || (git commit -m "Bot-Lauf $(date -u +'%Y-%m-%d %H:%M') UTC" && git pull --rebase && git push)
